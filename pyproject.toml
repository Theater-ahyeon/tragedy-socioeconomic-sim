[project]
name = "tragedy"
version = "0.1.0"
description = "Agent-Based Socio-Economic Simulation System"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12"
authors = [
    { name = "Theater-ahyeon" }
]
keywords = [
    "agent-based-modeling",
    "computational-economics",
    "simulation",
    "complex-systems",
    "inequality",
]

dependencies = [
    "numpy>=1.26",
    "numba>=0.59",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=12",
    "pydantic>=2",
    "pyyaml>=6",
    "aiosqlite>=0.20",
    "pandas>=2.2",
    "scipy>=1.13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-benchmark>=4",
    "pytest-asyncio>=0.23",
    "hypothesis>=6",
    "mypy>=1",
    "ruff>=0.5",
]
analysis = [
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "jupyter>=1.0",
    "pyarrow>=16",
]

[project.scripts]
tragedy-server = "tragedy.api.app:main"
tragedy-run = "tragedy.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
